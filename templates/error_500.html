<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error — EasyClean Pro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width:680px">
  <div class="card border-0 shadow-sm">
    <div class="card-body p-4">
      <h4 class="text-danger mb-1"><i class="bi bi-exclamation-triangle-fill me-2"></i>Algo salió mal</h4>
      <p class="text-muted mb-3">El servidor encontró un error. El equipo técnico ya fue notificado en los logs de Railway.</p>
      <a href="/" class="btn btn-primary btn-sm me-2">Ir al Dashboard</a>
      <a href="javascript:history.back()" class="btn btn-outline-secondary btn-sm">Volver atrás</a>
      <hr class="my-3">
      <details>
        <summary class="small text-muted" style="cursor:pointer">Ver detalle del error (para el administrador)</summary>
        <pre class="mt-2 p-3 bg-dark text-light rounded small" style="overflow-x:auto;font-size:.72rem">{{ error }}

{{ tb }}</pre>
      </details>
    </div>
  </div>
</div>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</body>
</html>
