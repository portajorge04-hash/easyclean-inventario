<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyClean Pro — Nueva Contraseña</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1c20c4 0%, #1616a8 55%, #0ea5e9 100%);
      min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      font-family: 'Segoe UI', sans-serif; padding: 1rem;
    }
    .login-card { background: #fff; border-radius: 20px; padding: 2.5rem 2rem; width: 100%; max-width: 400px; box-shadow: 0 24px 60px rgba(0,0,0,.25); }
    .form-label { font-size: .85rem; font-weight: 600; color: #374151; }
    .form-control { border-radius: 10px; border: 1.5px solid #e2e8f0; padding: .65rem .9rem; font-size: .92rem; }
    .form-control:focus { border-color: #1c20c4; box-shadow: 0 0 0 3px rgba(28,32,196,.12); }
    .btn-login { background: linear-gradient(135deg, #1c20c4, #0ea5e9); border: none; border-radius: 10px; color: #fff; font-weight: 600; font-size: .95rem; padding: .7rem; width: 100%; }
    .btn-login:hover { opacity: .92; color: #fff; }
  </style>
</head>
<body>
<div class="login-card">
  <h5 class="mb-1"><i class="bi bi-lock me-1"></i>Nueva Contraseña</h5>
  <p class="text-muted small mb-4">Código verificado. Define tu nueva contraseña (mínimo 6 caracteres).</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} py-2 mb-3" style="font-size:.85rem;border-radius:10px">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST">
    <div class="mb-4">
      <label class="form-label">Nueva contraseña</label>
      <input type="password" name="password" class="form-control" minlength="6" required autofocus>
    </div>
    <button type="submit" class="btn-login"><i class="bi bi-check-circle me-2"></i>Guardar y continuar</button>
  </form>
</div>
</body>
</html>
